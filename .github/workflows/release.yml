name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # cosign keyless signing

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o bin/dizzy-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/dizzy/
      - name: Import Apple signing certificate
        if: matrix.goos == 'darwin' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
      - name: Sign macOS binary
        if: matrix.goos == 'darwin'
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          IDENTITY="${APPLE_IDENTITY:--}"
          codesign --force --options runtime -s "$IDENTITY" \
            bin/dizzy-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dizzy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/dizzy-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 1

  image:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    env:
      IMAGE: ghcr.io/b42labs/dizzy
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dizzy-linux-*
          path: bin/
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      # Pushed untagged; the last step tags it once it is tested and signed.
      - name: Build and push the image by digest
        id: push
        run: |
          docker buildx create --use
          docker buildx build \
            --platform "$PLATFORMS" \
            --provenance=false --sbom=false \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,push=true" \
            --metadata-file image-metadata.json \
            .
          digest="$(jq -r '."containerimage.digest" // empty' image-metadata.json)"
          case "$digest" in
            sha256:*) ;;
            *) echo "error: no image digest in image-metadata.json"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the pushed image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          got="$(docker run --rm "${IMAGE}@${DIGEST}" --version)"
          test "$got" = "dizzy ${GITHUB_REF_NAME}" \
            || { echo "error: image reports '$got', want 'dizzy ${GITHUB_REF_NAME}'"; exit 1; }
          # Export every platform's filesystem without running it, so no emulation.
          printf 'FROM %s@%s\n' "$IMAGE" "$DIGEST" \
            | docker buildx build --platform "$PLATFORMS" --output type=local,dest=image-fs -
          for platform in ${PLATFORMS//,/ }; do
            arch="${platform#linux/}"
            cmp "image-fs/linux_${arch}/usr/local/bin/dizzy" "bin/dizzy-linux-${arch}" \
              || { echo "error: the ${platform} image binary differs from the release asset"; exit 1; }
          done

      - name: Sign the image and attest an SBOM per platform
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw \
            | jq -r '.manifests[] | "\(.platform.architecture) \(.digest)"' > image-platforms.txt
          count="$(wc -l < image-platforms.txt | tr -d ' ')"
          want="$(printf '%s\n' "$PLATFORMS" | tr ',' '\n' | wc -l | tr -d ' ')"
          test "$count" -eq "$want" \
            || { echo "error: expected ${want} platform manifests (${PLATFORMS}), got $count"; exit 1; }
          cosign sign --yes "${IMAGE}@${DIGEST}"
          while read -r arch platform_digest; do
            syft "registry:${IMAGE}@${platform_digest}" \
              --output spdx-json="dizzy-image-linux-${arch}.spdx.json"
            cosign sign --yes "${IMAGE}@${platform_digest}"
            cosign attest --yes --type spdxjson \
              --predicate "dizzy-image-linux-${arch}.spdx.json" \
              "${IMAGE}@${platform_digest}"
          done < image-platforms.txt

      - name: Tag the signed image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "${IMAGE}:${GITHUB_REF_NAME}" "${IMAGE}@${DIGEST}"
          got="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" --format '{{.Manifest.Digest}}')"
          test "$got" = "$DIGEST" || { echo "error: tag resolves to '$got', want '$DIGEST'"; exit 1; }

  sign-and-release:
    name: Sign, SBOM & Release
    needs: [build, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      - name: Collect binaries
        run: |
          mkdir -p dist
          for dir in artifacts/dizzy-*; do
            cp "$dir"/dizzy-* dist/
          done
          ls -lh dist/

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate checksums
        working-directory: dist
        run: sha256sum dizzy-* > checksums.txt

      - name: Sign binaries and checksums with cosign
        working-directory: dist
        run: |
          for file in dizzy-* checksums.txt; do
            cosign sign-blob --yes \
              --new-bundle-format \
              --bundle "${file}.bundle" \
              "$file"
          done

      - name: Generate SBOMs
        run: |
          for bin in dist/dizzy-*; do
            # skip cosign signature bundles
            case "$bin" in *.bundle) continue ;; esac
            name=$(basename "$bin")
            syft "$bin" --output spdx-json="dist/${name}.spdx.json"
            syft "$bin" --output cyclonedx-json="dist/${name}.cdx.json"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
