name: small
seed: 42                        # deterministic; same seed => same plan

# dizzy stores a synthetic, generated payload in every secret, so a run
# references no pre-existing secret. Each order asks Barbican to generate an
# AES-256 key server side and is polled until ACTIVE; each container groups
# stored secrets by reference.
resources:
  secrets:    10                # opaque secrets stored with a payload
  orders:     5                 # AES-256 key orders, each generating one more secret
  containers: 3                 # generic containers referencing stored secrets

distribution:
  payload_bytes:         { min: 64, max: 8192 }   # synthetic payload per stored secret, in raw bytes
  retrieve_ratio:        0.5                      # fraction of stored secrets read back and byte-compared
  secrets_per_container: { min: 1, max: 3 }       # distinct stored secrets referenced per container

# Barbican's project quotas default to unlimited (-1), so this profile carries
# no quota risk there. The payload range encodes to at most 10924 base64
# characters, under Barbican's default max_allowed_secret_in_bytes of 20000.
