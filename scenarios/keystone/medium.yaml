name: medium
seed: 42

resources:
  domains:  2                  # admin-only (> 1 domain): domain-manager mode rejects this profile
  roles:    3                  # admin-only; ignored in domain-manager mode
  projects: 20
  users:    50
  application_credentials: 10  # each created by a user on one of its project grants, then authenticated with
  trusts:                  10  # each from a user on one of its project grants to another user, then authenticated with

distribution:
  projects_per_domain:            { min: 1, max: 5 }
  assignments_per_user:           { min: 1, max: 3 }
  domain_scoped_assignment_ratio: 0.1
  users_issuing_tokens_ratio:     0.5

chaos:
  duration: 30m
  interval: { min: 200ms, max: 3s }
  parallel: { max: 4 }
  churn_ratio: 0.5
  target_fill: 0.8
  token_ratio: 0.3                     # issue a token, or authenticate with an application credential or trust

pressure:
  duration: 30m
  workers: 32
  tokens: 200
